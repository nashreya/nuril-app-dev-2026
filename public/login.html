<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log In</title>

  <link rel="stylesheet" href="/styles.css">
</head>

<body>

  <main class="auth-card">

    
    <section class="auth-form">

      <h1>Log in</h1>

      <form id="login-form" novalidate>

        <!-- USERNAME -->
        <div class="form-group">
          <label for="username">Username</label>

          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
          >
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
          >
        </div>

        <!-- LOGIN BUTTON -->
        <button type="submit">Log In</button>

      </form>

      <!-- ERROR / SUCCESS MESSAGE -->
      <p
        id="message"
        class="message"
        role="status"
        hidden
      ></p>

      <!-- SIGN UP LINK -->
      <p class="alt">
        or <a href="/signup.html">Sign up</a>
      </p>

    </section>


    <!-- RIGHT PURPLE SIDE -->
    <section class="purple-panel">

      <div class="shape shape-one"></div>
      <div class="shape shape-two"></div>
      <div class="shape shape-three"></div>

    </section>

  </main>


  <script>

    const form = document.getElementById("login-form");
    const message = document.getElementById("message");
    const button = form.querySelector("button");


    // Display success/error messages
    function show(text, kind, status) {

      message.textContent = status
        ? text + " (" + status + ")"
        : text;

      message.className = "message " + kind;
      message.hidden = false;
    }


    // LOGIN FORM SUBMISSION
    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      message.hidden = true;
      button.disabled = true;


      // Get username and password from form
      const data = Object.fromEntries(
        new FormData(form).entries()
      );


      try {

        // Send login information to Express server
        const response = await fetch("/api/login", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(data)

        });


        const body = await response.json();


        // Successful login
        if (response.status === 200) {

          show(
            body.message + " Taking you to your homepage.",
            "success",
            200
          );


          // Save logged-in username
          sessionStorage.setItem(
            "username",
            body.user.username
          );


          // Go to homepage
          setTimeout(() => {

            window.location.href = "/home.html";

          }, 800);


          return;
        }


        // Incorrect username/password or empty fields
        show(
          body.message || "Something went wrong.",
          "error",
          response.status
        );


      } catch (error) {

        show(
          "Can't reach the server. Is it running?",
          "error"
        );


      } finally {

        button.disabled = false;

      }

    });

  </script>

</body>
</html>

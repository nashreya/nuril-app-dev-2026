<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/style.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 3rem auto; padding: 0 1rem; }
    button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
    nav { margin-bottom: 1rem; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/about-me.html">About me</a>
    <a href="/users.html">Users</a>
  </nav>
  <h1 id="greeting">Loading...</h1>
  <p id="details"></p>
  <button id="logout">Log out</button>

  <script>
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "/index.html"; // no wristband, go back to login

    async function loadProfile() {
      const res = await fetch("/api/users/about-me", {
        headers: { Authorization: `Bearer ${token}` }, // send the token on every protected request
      });

      if (!res.ok) {
        localStorage.removeItem("token"); // expired or invalid
        window.location.href = "/index.html";
        return;
      }

      const user = await res.json();
      document.getElementById("greeting").textContent = `Hello, ${user.username}`;
      document.getElementById("details").textContent = `Signed in as ${user.email}`;
    }

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("token"); // logging out = throwing the token away
      window.location.href = "/index.html";
    });

    loadProfile();
  </script>
</body>
</html>

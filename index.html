<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Virtual Ledger</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <section class="ledger" aria-label="To-do ledger">

      <header class="ledger__header">
        <div class="ledger__margin-mark" aria-hidden="true"></div>
        <div class="ledger__heading">
          <h1 class="ledger__title">My Virtual Ledger</h1>
          <p class="ledger__date" id="todayDate"></p>
        </div>
        <div class="ledger__counts" id="counts" aria-live="polite">
          <span id="openCount">0</span> open · <span id="doneCount">0</span> done
        </div>
      </header>

      <form class="entry-row" id="taskForm" novalidate>
        <span class="entry-row__bullet" aria-hidden="true">+</span>
        <label for="taskInput" class="sr-only">New task</label>
        <input
          type="text"
          id="taskInput"
          name="task"
          placeholder="Write today's next task…"
          autocomplete="off"
          maxlength="120"
        />
        <button type="submit" class="btn btn--add">Add</button>
      </form>
      <p class="char-limit" id="charLimit">Maximum of 120 characters reached.</p>
      <p class="entry-row__error" id="formError" role="alert" aria-live="assertive"></p>
      
      <ul class="task-list" id="taskList">
        <!-- Task rows injected by JS -->
      </ul>

      <p class="empty-state" id="emptyState">
        No entries yet. Add one above.
      </p>

      <footer class="ledger__footer">
        <button type="button" class="btn btn--clear" id="deleteAllBtn">
          <span class="btn__label">Delete all</span>
          <span class="btn__loading" hidden>Clearing<span class="dots"><span>.</span><span>.</span><span>.</span></span></span>
        </button>
      </footer>

    </section>

    <p class="page__footnote">All changes saved.</p>
  </main>

<script src="script.js"></script>
</body>
</html>
